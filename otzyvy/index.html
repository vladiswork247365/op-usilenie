<style>
:root{--bg:#0a0e16;--bg2:#0f1622;--navy:#102234;--red:#e4002b;--red-soft:#ff2d4f;--white:#f4f6fa;--grey:#8a96a8;--line:rgba(255,255,255,.08)}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--white);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
/* topbar */
.top{position:sticky;top:0;z-index:50;background:rgba(10,14,22,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:68px}
.logo-txt{font-weight:900;font-size:22px;letter-spacing:1px;line-height:1}
.logo-txt b{color:var(--red)}
.logo-sub{display:block;font-size:9px;font-weight:600;color:var(--grey);letter-spacing:3px;margin-top:4px}
.back{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--grey);border:1px solid var(--line);padding:10px 16px;border-radius:12px;transition:.25s;background:rgba(255,255,255,.03)}
.back:hover{color:#fff;border-color:var(--red);background:var(--red)}
/* hero */
.hero{position:relative;text-align:center;padding:64px 0 34px}
.glow{position:absolute;border-radius:50%;filter:blur(40px);pointer-events:none;z-index:0}
.glow.a{width:460px;height:460px;background:radial-gradient(circle,#e4002b55,transparent 70%);top:-160px;left:50%;transform:translateX(-50%)}
.hero .in{position:relative;z-index:1}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--red-soft);border:1px solid var(--line);padding:8px 16px;border-radius:100px;margin-bottom:18px}
.hero h1{font-size:clamp(30px,5vw,52px);font-weight:900;line-height:1.05;letter-spacing:-.5px}
.hero p{margin-top:16px;color:var(--grey);font-size:16px;font-weight:500}
.hero p b{color:var(--white)}
/* tabs */
.tabs{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:34px 0 10px}
.tab{cursor:pointer;font-family:inherit;font-size:15px;font-weight:700;color:var(--grey);background:rgba(255,255,255,.03);border:1px solid var(--line);padding:14px 22px;border-radius:14px;transition:.25s}
.tab .c{color:var(--red-soft);margin-left:6px}
.tab:hover{color:#fff;border-color:rgba(255,255,255,.2)}
.tab.on{color:#fff;background:var(--red);border-color:var(--red);box-shadow:0 12px 34px -12px #e4002b}
.tab.on .c{color:#fff;opacity:.85}
/* gallery masonry */
.gal{padding:26px 0 70px}
.grid{column-gap:16px}
.grid{columns:4 260px}
@media(max-width:900px){.grid{columns:3 220px}}
@media(max-width:620px){.grid{columns:2 150px}}
.shot{display:block;break-inside:avoid;margin:0 0 16px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--bg2);transition:.25s;cursor:zoom-in}
.shot:hover{border-color:var(--red);transform:translateY(-4px);box-shadow:0 16px 40px -16px #000}
.shot img{display:block;width:100%;height:auto}
.pane{display:none}
.pane.on{display:block}
/* lightbox */
.lb{position:fixed;inset:0;z-index:100;background:rgba(5,7,12,.94);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:24px}
.lb.on{display:flex}
.lb img{max-width:96vw;max-height:92vh;border-radius:12px;box-shadow:0 30px 80px -20px #000}
.lb .x{position:absolute;top:20px;right:24px;width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s}
.lb .x:hover{background:var(--red);border-color:var(--red)}
.lb .nav{position:absolute;top:50%;transform:translateY(-50%);width:54px;height:54px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;user-select:none}
.lb .nav:hover{background:var(--red);border-color:var(--red)}
.lb .prev{left:20px}.lb .next{right:20px}
@media(max-width:620px){.lb .nav{width:44px;height:44px;font-size:22px}}
/* footer cta */
.foot{border-top:1px solid var(--line);text-align:center;padding:48px 0 60px}
.foot h2{font-size:clamp(22px,3.4vw,32px);font-weight:900;margin-bottom:20px}
.btn{display:inline-block;font-weight:800;font-size:16px;padding:18px 34px;border-radius:16px;background:var(--red);color:#fff;transition:.25s;box-shadow:0 16px 40px -14px #e4002b}
.btn:hover{background:var(--red-soft);transform:translateY(-3px)}
</style>
</head>

<div class="lb" id="lb">
  <button class="x" id="lbx" aria-label="Закрыть">&times;</button>
  <button class="nav prev" id="lbp" aria-label="Назад">&#8249;</button>
  <img id="lbimg" src="" alt="Отзыв">
  <button class="nav next" id="lbn" aria-label="Вперёд">&#8250;</button>
</div>

<script>
// tabs
var tabs=document.querySelectorAll('.tab'),panes=document.querySelectorAll('.pane');
tabs.forEach(function(t){t.addEventListener('click',function(){
  tabs.forEach(function(x){x.classList.remove('on')});t.classList.add('on');
  panes.forEach(function(p){p.classList.toggle('on',p.id===t.dataset.pane)});
  window.scrollTo({top:0,behavior:'smooth'});
});});
// lightbox
var lb=document.getElementById('lb'),lbimg=document.getElementById('lbimg');
var cur=[],idx=0;
function openLb(list,i){cur=list;idx=i;lbimg.src=cur[idx];lb.classList.add('on');document.body.style.overflow='hidden';}
function closeLb(){lb.classList.remove('on');document.body.style.overflow='';}
function step(d){idx=(idx+d+cur.length)%cur.length;lbimg.src=cur[idx];}
document.querySelectorAll('.pane').forEach(function(pane){
  var shots=[].slice.call(pane.querySelectorAll('.shot'));
  var urls=shots.map(function(s){return s.dataset.full});
  shots.forEach(function(s,i){s.addEventListener('click',function(e){e.preventDefault();openLb(urls,i);});});
});
document.getElementById('lbx').onclick=closeLb;
document.getElementById('lbn').onclick=function(){step(1)};
document.getElementById('lbp').onclick=function(){step(-1)};
lb.addEventListener('click',function(e){if(e.target===lb)closeLb();});
document.addEventListener('keydown',function(e){if(!lb.classList.contains('on'))return;
  if(e.key==='Escape')closeLb();if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1);});
</script>
